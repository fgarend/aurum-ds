# Releases a version, by hand only (decisions 0048, 0049, 0051 and 0062): it takes the version and the commit the app
# tested, runs every check again on that commit and builds its gallery of components, checks the version and the
# changelog, checks the commit is on main, tags it, publishes its release page with the changelog's notes and the packed
# package, and then the gallery on GitHub Pages. The only workflow that writes, and only in its last two jobs. The inputs
# reach the shell through the environment, never inline.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 0.1.0
        required: true
        type: string
      commit:
        description: The commit of main the app tested, in full
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      commit: ${{ inputs.commit }}

  # The gallery, built before the tag so that no release is made without it, and kept for the Pages job.
  gallery:
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Build the gallery (make storybook-build)
        run: make storybook-build
      - name: Keep the gallery for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/

  tag:
    needs: [check, gallery]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Check the version can be released (make check-release)
        run: make check-release VERSION="$VERSION"
      - name: Take the notes from the changelog
        run: make release-notes VERSION="$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Pack the package
        run: make release-package > "$RUNNER_TEMP/fgarend-aurum-ds-$VERSION.tgz"
      - name: The commit is on main
        run: git merge-base --is-ancestor "$COMMIT" origin/main
      - name: Tag the commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$COMMIT"
          git push origin "v$VERSION"
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/fgarend-aurum-ds-$VERSION.tgz"

  # The gallery of the released version, on GitHub Pages, replacing the previous one. The only job that writes to Pages.
  pages:
    needs: tag
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the gallery on Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
