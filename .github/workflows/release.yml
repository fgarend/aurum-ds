# Releases a version by itself (decisions 0048, 0049, 0051, 0062 and 0066): when the checks pass on a push to main of
# this repository, and the commit is a release, one whose version has no tag yet and whose changelog is ready, it builds
# the gallery of components, tags the commit, publishes its release page with the changelog's notes and the packed
# package, and then the gallery on GitHub Pages. Other commits stop at the first job, with the reason on the run's
# page. The only workflow that writes, and only in its last two jobs. GitHub runs this file as it is on main, on the
# commit the checks ran on.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Whether the commit is a release: only checks that passed on a push to main of this repository, never on a pull
  # request, whose code could not be trusted with the write access that follows.
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check the commit is a release (make check-release)
        id: release
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Not a release: v$version is already released." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif make check-release VERSION="$version"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release: v$version is not ready, as make check-release says in this job's log." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # The gallery, built before the tag so that no release is made without it, and kept for the Pages job.
  gallery:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Build the gallery (make storybook-build)
        run: make storybook-build
      - name: Keep the gallery for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/

  tag:
    needs: [verify, gallery]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Take the notes from the changelog
        run: make release-notes VERSION="$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Pack the package
        run: make release-package > "$RUNNER_TEMP/fgarend-aurum-ds-$VERSION.tgz"
      - name: The commit is on main
        run: git merge-base --is-ancestor "$COMMIT" origin/main
      - name: Tag the commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$COMMIT"
          git push origin "v$VERSION"
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/fgarend-aurum-ds-$VERSION.tgz"

  # The gallery of the released version, on GitHub Pages, replacing the previous one. The only job that writes to Pages.
  pages:
    needs: tag
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the gallery on Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
