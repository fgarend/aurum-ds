# The repository's one pipeline (decisions 0046, 0062 and 0067), on every push to main, every pull request and by hand.
# The job check runs the checks of make check, each a step of its own, every step running even when one before it
# failed, as make -k does; the steps must stay those of make check, in its order: test/workflows.test.ts compares them.
# On a push to main whose checks all pass, it asks whether the commit is a release, one whose version has no tag yet
# and whose changelog is ready, and then prepares it once: the audit, the gallery, the notes and the packed package.
# The jobs tag and pages then publish what it prepared, running none of the project's code; they are the only ones
# that write.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # ARM, as the machines the approved screenshots were taken on.
    runs-on: ubuntu-24.04-arm
    # A newer push cancels the checks still running; the release's jobs are never cancelled halfway.
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images (make images)
        id: images
        run: make images
      - name: Lint and formatting (make lint)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make lint
      - name: Types (make types)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make types
      - name: Tests of logic (make test)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make test
      - name: Checks of the repository (make test-repository)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make test-repository
      - name: Tests in the browsers (make test-browser)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make test-browser
      - name: Coverage (make coverage)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make coverage
      # The coverage table, on the run's page (decision 0061).
      - name: Coverage table on this page
        if: ${{ !cancelled() && hashFiles('coverage/coverage.txt') != '' }}
        run: |
          {
            echo '```'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pack and install the package (make pack)
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: make pack
      # A release: a push to main whose checks all passed, with a version that has no tag yet and a ready changelog.
      - name: Is it a release? (make check-release)
        id: release
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Not a release: v$version is already released." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif make check-release VERSION="$version"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a release: v$version is not ready, as make check-release says in this job's log." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      # No release with a known vulnerability left unreviewed (decision 0058), then everything it publishes, built once.
      - name: Prepare the release (make audit, make storybook-build, the notes and the package)
        if: ${{ steps.release.outputs.release == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          make audit
          make storybook-build
          mkdir -p "$RUNNER_TEMP/release"
          make release-notes VERSION="$VERSION" > "$RUNNER_TEMP/release/notes.md"
          make release-package > "$RUNNER_TEMP/release/fgarend-aurum-ds-$VERSION.tgz"
      - name: Keep the gallery for Pages
        if: ${{ steps.release.outputs.release == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/
      - name: Keep the notes and the package for the release
        if: ${{ steps.release.outputs.release == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      # The images a failing visual test writes, to download from the run's page.
      - name: Keep the failing screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-attachments
          path: .vitest-attachments/
          if-no-files-found: ignore

  # The tag and the release page, from what the checks prepared (decisions 0048, 0049 and 0051).
  tag:
    needs: check
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-24.04-arm
    # One release at a time, never cancelled.
    concurrency:
      group: ${{ github.workflow }}-tag
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Take the notes and the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
      - name: The commit is on main
        run: git merge-base --is-ancestor "$COMMIT" origin/main
      - name: Tag the commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$COMMIT"
          git push origin "v$VERSION"
      - name: Publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" "$RUNNER_TEMP/release/fgarend-aurum-ds-$VERSION.tgz"

  # The gallery of the released version, on GitHub Pages, replacing the previous one (decision 0062). The only job that
  # writes to Pages.
  pages:
    needs: tag
    runs-on: ubuntu-24.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the gallery on Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
