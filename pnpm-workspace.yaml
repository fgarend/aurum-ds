# Project settings for pnpm (decisions 0008 and 0009).
# Versions published less than 7 days ago are refused (minutes).
minimumReleaseAge: 10080
# A version whose publish time the registry does not give is refused, not let past the release age (decision 0050).
minimumReleaseAgeIgnoreMissingTime: false
# Peer dependencies are not installed on their own: the versions used here are declared in devDependencies.
autoInstallPeers: false
# Dependencies are saved with their exact version (decision 0015).
saveExact: true
# Build scripts of dependencies, refused unless listed true here. esbuild's only checks the binary that arrives as its
# own package, so it is refused, said out loud so pnpm does not ask again (decision 0057).
allowBuilds:
  esbuild: false
# Advisories reviewed and accepted, by their GitHub code, each with its reason (decisions 0012 and 0058).
audit:
  ignore:
    # glob and minimatch, through Storybook's docgen plugin, whose latest version still depends on glob 13. Both slow
    # down a search of files whose pattern an attacker writes; the plugin only searches the components' own files,
    # and nothing of it reaches the package. Goes when the plugin moves to glob 14.0.2 or later.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
