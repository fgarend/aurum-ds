<!-- @dsCard group="Finance" height=1120 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatStrip — preview</title></head>
<body>
<div id="root"></div>
<script>
var B = window.Aurum, h = React.createElement;
var items=[
 {label:'Total balance',icon:'wallet',value:48215.9,delta:4.2,deltaLabel:'vs Sep',highlight:true},
 {label:'Income',icon:'arrow-down-left',value:8450,delta:6.5,deltaLabel:'vs Sep'},
 {label:'Expenses',icon:'arrow-up-right',value:6184.35,delta:-12.4,invertDelta:true,deltaLabel:'less than Sep'},
 {label:'Invested',icon:'trending-up',value:126900,delta:1.8,deltaLabel:'this month'}];
var plain=items.map(function(i){ return Object.assign({},i,{highlight:false}); });
function Ex(t,props){ return h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
  h('span',{style:{fontSize:12,lineHeight:'16px',color:'var(--ink-subtle)'}},t), h(B.StatStrip,props)); }
function Demo(){ return h('div',{style:{padding:20,display:'flex',flexDirection:'column',gap:24}},
 Ex('layout default · iconVariant soft',{items:plain}),
 Ex('layout side · solid · circle (highlight on the first item)',{items:items,layout:'side',iconVariant:'solid',iconShape:'circle'}),
 Ex('layout side · solid · square',{items:items,layout:'side',iconVariant:'solid'}),
 Ex('layout side · outline · circle',{items:plain,layout:'side',iconVariant:'outline',iconShape:'circle'}),
 Ex('layout side · soft · circle',{items:plain,layout:'side',iconVariant:'soft',iconShape:'circle'}),
 Ex('household view · breakdown per person',{layout:'side',iconVariant:'solid',iconShape:'circle',items:items.map(function(it,i){ var f=[0.69,0.57,0.56,0.70][i]; return Object.assign({},it,{breakdown:[{label:'Felipe',initials:'F',tone:5,value:it.value*f},{label:'Carla',initials:'C',tone:7,value:it.value*(1-f)}]}); })})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
