<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root"></div>
<script>
var B = window.Aurum, h = React.createElement, useState = React.useState;
function Demo(){ return h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(96px,1fr))',gap:8,padding:20}},
 B.Icon.names.map(function(n){ return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'10px 4px',color:'var(--ink)'}},
  h(B.Icon,{name:n,size:22}), h('span',{style:{fontSize:11,color:'var(--ink-subtle)'}},n)); })); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
