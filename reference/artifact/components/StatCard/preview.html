<!-- @dsCard group="Finance" height=1080 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatCard — preview</title></head>
<body>
<div id="root"></div>
<script>
var B = window.Aurum, h = React.createElement;
var K = [
 {label:'Total balance',icon:'wallet',value:48215.9,delta:4.2,deltaLabel:'vs Sep',footer:'Checking, savings and card',highlight:true},
 {label:'Income',icon:'arrow-down-left',value:8450,delta:6.5,deltaLabel:'vs Sep',footer:'Salary and 1 freelance job'},
 {label:'Expenses',icon:'arrow-up-right',value:6184.35,delta:-12.4,invertDelta:true,deltaLabel:'less than Sep',footer:'128 entries · largest: rent'},
 {label:'Invested',icon:'trending-up',value:126900,delta:1.8,deltaLabel:'this month',footer:'R$ 2.240,00 earned'}];
function Row(t, extra){ return h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
  h('span',{style:{fontSize:12,lineHeight:'16px',color:'var(--ink-subtle)'}},t),
  h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:16}},
    K.map(function(k,i){ return h(B.StatCard,Object.assign({key:i},k,extra)); }))); }
function Demo(){ return h('div',{style:{padding:20,display:'flex',flexDirection:'column',gap:24}},
 Row('layout default · iconVariant outline', {highlight:false}),
 Row('layout side · solid · circle', {layout:'side',iconVariant:'solid',iconShape:'circle'}),
 Row('layout side · solid · square', {layout:'side',iconVariant:'solid'}),
 Row('layout side · outline · circle', {layout:'side',iconVariant:'outline',iconShape:'circle',highlight:false}),
 Row('layout side · soft · square', {layout:'side',iconVariant:'soft',highlight:false})); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
