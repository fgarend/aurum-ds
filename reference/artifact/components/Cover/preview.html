<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurum</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--primary); }
  .gold { fill:var(--gold); }
  .sand { fill:var(--sand); }
  .stone { fill:var(--chart-5); }
  .inc { fill:var(--income); }
  .blk { rx:var(--radius-lg); }
  .bar { fill:var(--gold); rx:8px; }
  .bar.ink { fill:var(--primary); }
  .words { position:absolute; left:var(--space-10); bottom:var(--space-10); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.045em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      graphite primary 144×256 bled off the top (the identity colour, largest) · gold 96×128 (the accent) · stone 96×176 · sand 112×216 bleeding off the right · income 48×16 pill once (signal only) — ≈35% of 960×288
  arrangement one tall graphite slab, then three blocks stepping up to the right like a rising column chart; bottoms on one line space-12 above the edge, space-4 gutters
  pattern     literal motif — a growth chart of pills (radius-pill, 16 wide at a space-6 pitch) cut into the slab in gold, because the system is about money moving and numbers first; two graphite bars rise out of the sand block
  scales      sides in space-4 multiples; gutters space-4; pitch space-6; corners radius-lg on blocks, pills rx = half of 16
-->
<rect class="deep blk" x="16" y="-16" width="144" height="256" rx="8"/>
<rect class="gold blk" x="176" y="112" width="96" height="128" rx="8"/>
<rect class="stone blk" x="288" y="64" width="96" height="176" rx="8"/>
<rect class="sand blk" x="400" y="24" width="112" height="216" rx="8"/>
<rect class="inc" x="176" y="256" width="48" height="16" rx="8"/>
<rect class="bar" x="40" y="192" width="16" height="32" rx="8"/>
<rect class="bar" x="64" y="168" width="16" height="56" rx="8"/>
<rect class="bar" x="88" y="176" width="16" height="48" rx="8"/>
<rect class="bar" x="112" y="128" width="16" height="96" rx="8"/>
<rect class="bar" x="136" y="72" width="16" height="152" rx="8"/>
<rect class="bar ink" x="424" y="104" width="16" height="120" rx="8"/>
<rect class="bar ink" x="448" y="64" width="16" height="160" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">Aurum</h1>
<p class="tag">A quiet, legible system for products that handle money.</p>
</div>
</div>
</body>
</html>
