# Where and how each command runs (decisions 0043 and 0047): the image, what is mounted, and whether the code can be written.
# The Makefile chooses the service; what runs is the command it passes. Values come from infra/settings.env.
name: aurum-ds

x-build: &build
  context: ..
  dockerfile: infra/Dockerfile
  args:
    PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:?set in infra/settings.env}
    PNPM_IMAGE: ${PNPM_IMAGE:?set in infra/settings.env}

# The code, read-only, over the dependencies of the image: the folder node_modules of the machine is hidden, so the
# image's own is used.
x-read: &read
  - ..:/app:ro
  - /app/node_modules

services:
  # The tools and the browsers, checking only. The pnpm store is a cache for make pack, a failing visual test writes
  # its images to .vitest-attachments, make coverage its report to coverage, and make storybook-build the gallery to
  # storybook-static, the only folders they may write.
  tools:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app:ro
      - /app/node_modules
      - pnpm-store:/pnpm-store
      - ../.vitest-attachments:/app/.vitest-attachments
      - ../coverage:/app/coverage
      - ../storybook-static:/app/storybook-static

  # The same, writing the code: make format, make tokens, make screenshots and make reference.
  tools-write:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app
      - /app/node_modules

  # Installs the dependencies into the machine's node_modules and the lockfile.
  install:
    image: aurum-ds:base
    build: { <<: *build, target: base }
    volumes:
      - ..:/app
      - pnpm-store:/pnpm-store

  # Serves the prototype's screens, with a port of its own.
  prototype:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    init: true
    environment:
      PROTOTYPE_PORT: ${PROTOTYPE_PORT}
    ports:
      - ${PROTOTYPE_PORT:?set in infra/settings.env}:${PROTOTYPE_PORT}
    volumes: *read

  # Serves the gallery of components, Storybook (decision 0057), with a port of its own.
  storybook:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    init: true
    environment:
      STORYBOOK_PORT: ${STORYBOOK_PORT}
    ports:
      - ${STORYBOOK_PORT:?set in infra/settings.env}:${STORYBOOK_PORT}
    volumes: *read

volumes:
  pnpm-store:
    name: aurum-ds-pnpm-store
