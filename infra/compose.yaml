# Where and how each command runs (decision 0043): the image, what is mounted, and whether the code can be written.
# The Makefile chooses the service; what runs is the command it passes. Values come from infra/settings.env.
name: aurum-ds

x-build: &build
  context: ..
  dockerfile: infra/Dockerfile
  args:
    NODE_IMAGE: ${NODE_IMAGE:?set in infra/settings.env}
    PNPM_IMAGE: ${PNPM_IMAGE:?set in infra/settings.env}

# The code, read-only, over the dependencies of the image: the folder node_modules of the machine is hidden, so the
# image's own is used.
x-read: &read
  - ..:/app:ro
  - /app/node_modules

x-write: &write
  - ..:/app
  - /app/node_modules

services:
  # The tools, checking only. The pnpm store is a cache for make pack.
  tools:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    volumes:
      - ..:/app:ro
      - /app/node_modules
      - pnpm-store:/pnpm-store

  # The tools, writing the code: make format and make tokens.
  tools-write:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    volumes: *write

  # With the browser, checking only. A failing visual test writes its images to .vitest-attachments, the one folder it
  # may write.
  browser:
    image: aurum-ds:browser
    build: { <<: *build, target: browser }
    volumes:
      - ..:/app:ro
      - /app/node_modules
      - ../.vitest-attachments:/app/.vitest-attachments

  # With the browser, writing the screenshots.
  browser-write:
    image: aurum-ds:browser
    build: { <<: *build, target: browser }
    volumes: *write

  # Installs the dependencies into the machine's node_modules and the lockfile.
  install:
    image: aurum-ds:base
    build: { <<: *build, target: base }
    volumes:
      - ..:/app
      - pnpm-store:/pnpm-store

  # Serves the prototype's screens: the only service with a port.
  prototype:
    image: aurum-ds:deps
    build: { <<: *build, target: deps }
    init: true
    environment:
      PROTOTYPE_PORT: ${PROTOTYPE_PORT}
    ports:
      - ${PROTOTYPE_PORT:?set in infra/settings.env}:${PROTOTYPE_PORT}
    volumes: *read

volumes:
  pnpm-store:
    name: aurum-ds-pnpm-store
